[Autologin]
# Autologin again on session exit
Relogin=false

# Autologin session
# Canli ISO Plasma'yi X11 ile baslatir (en guvenilir secenek).
# Wayland oturumu greeter'da "Plasma (Wayland)" olarak secilebilir.
# KURULAN sistemde bu ayar olmaz: kurulum sonrasi /usr/lib/sddm/
# sddm.conf.d/sddm.conf kaldirilir, SDDM varsayilani (X11) doner ve
# kullanici oturumu elle secer.
Session=plasmax11.desktop
# Autologin user
User=pisi

[General]
# Greeter X11'de calisir (weston kurulu degil). Kullanici oturumu
# yine de Wayland olabilir; SDDM oturumun tipini .desktop dosyasinin
# bulundugu dizinden belirler.
DisplayServer=x11

# Halt command
HaltCommand=/sbin/shutdown -h -P now

# Initial NumLock state
# Valid values: on|off|none
# If property is set to none, numlock won't be changed
Numlock=on

# Reboot command
RebootCommand=/sbin/shutdown -r now

# Input method module
InputMethod=

[Theme]
# Current theme name
Current=pisilinux

# Cursor theme
CursorTheme=Mevlana

# Face icon directory
# The files should be in username.face.icon format
FacesDir=/usr/share/sddm/faces

# Theme directory path
ThemeDir=/usr/share/sddm/themes


[Users]
# Default $PATH
DefaultPath=/bin:/usr/bin:/sbin:/usr/sbin:/usr/local/bin

# Hidden shells
# Users with these shells as their default won't be listed
HideShells=

# Hidden users
HideUsers=git,sddm

# Maximum user id for displayed users
MaximumUid=65000

# Minimum user id for displayed users
MinimumUid=1000

# Remember the session of the last successfully logged in user
# X11 varsayilan kalsin: false oldugunda son oturum kaydedilmez,
# state.conf'taki X11 on secili kalir.
RememberLastSession=false

# Remember the last successfully logged in user
RememberLastUser=true


[XDisplay]
# Xsetup script path
# A script to execute when starting the display server
DisplayCommand=/usr/share/sddm/scripts/Xsetup

# Minimum VT
# The lowest virtual terminal number that will be used.
MinimumVT=7

# X server path
ServerPath=/usr/bin/X

# Xsession script path
# A script to execute when starting the desktop session
SessionCommand=/usr/share/sddm/scripts/Xsession

# Session description directory
SessionDir=/usr/share/xsessions

# Xauth path
XauthPath=/usr/bin/xauth

[Wayland]
# Wayland oturumu istege bagli: greeter'da "Plasma (Wayland)"
# olarak secilebilir. Varsayilan oturum X11'dir (bkz. [Autologin]).
# CompositorCommand bilerek bos birakildi: greeter X11'de calisir
# (DisplayServer=x11), WAYLAND_DISPLAY'i oturumu baslatan
# startplama-wayland kendisi acar. "weston --shell=kiosk" gibi bir
# deger yazilirsa ve weston kurulu degilse greeter acilmaz.
CompositorCommand=

# Wayland oturum dosyalarinin aranacagi dizin
SessionDir=/usr/share/wayland-sessions
