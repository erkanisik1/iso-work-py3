# Keyboard'u öne aldık ki boot menülerinde veya erken aşamada kilitlenme olmasın
# Sıralama ÖNEMLİ: live_loop_mnt (Ventoy) miso'dan ÖNCE çalışmalı
HOOKS="base udev modconf keyboard block live_loop_mnt miso miso_kms filesystems fsck"

# USB sürücüleri ve dosya sistemleri için eksik genel modülleri (xhci_pci vb.) düzelttik
MODULES="keyboard nls_ascii exfat ext4 iso9660 loop squashfs vfat usb_storage uhci_hcd ehci_hcd xhci_pci dm_mod cdrom isofs ntfs3"

# İhtiyacın olan tüm ikili dosyalar kalıyor
BINARIES="blkid blockdev losetup switch_root fsck"

COMPRESSION="xz"